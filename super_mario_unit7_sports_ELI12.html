<script>
'use strict';
/* CONTENT DATABASE: five differentiated stages for each photographed Unit 7 topic. */
const W=[
{title:'SPORTS ARENA',icon:'⚽',desc:'Sports, free time and equipment',rules:['play + ball sports','go + -ing activities','do + martial arts'],ex:'We play basketball. We go swimming. We do karate.',hint:'Look for the verb used with this sport: play, go or do.',tasks:[
{type:'choice',q:'Which sport uses a racket?',options:['🏊 Swimming','🎾 Tennis','🥋 Karate'],answer:1,hint:'A racket hits a ball across a net.',example:'A tennis player uses a racket and a ball.'},
{type:'choice',q:'Choose the correct phrase.',options:['go football','play football','do football'],answer:1,hint:'Ball games usually use PLAY.',example:'We play volleyball. We go skiing.'},
{type:'match',q:'Match each sport to its equipment.',pairs:[['🎾 Tennis','Racket'],['🏏 Cricket','Bat'],['⛷️ Skiing','Skis']],hint:'Think of the object you hold or wear for each sport.',example:'Tennis → racket. Football → ball.'},
{type:'sort',q:'Choose all GO sports.',options:['🏄 Windsurfing','🏊 Swimming','🏐 Volleyball','⛷️ Skiing'],answer:[0,1,3],hint:'GO is often followed by an activity ending in -ing.',example:'Go cycling and go skateboarding. Play tennis.'},
{type:'build',q:'Build a correct sentence.',tokens:['go','I','cycling','on Sundays.'],answer:['I','go','cycling','on Sundays.'],hint:'Start with I. Use GO before cycling.',example:'I go swimming on Saturdays.'}]},
{title:'CAN / CAN’T',icon:'🍄',desc:'Ability and negative sentences',rules:['I / she / they + can + verb','can’t + base verb','Never add -s after can'],ex:'She can dance. He can’t ski.',tasks:[
{type:'choice',q:'Choose the correct sentence.',options:['She cans swim.','She can swim.','She can swimming.'],answer:1,hint:'CAN stays the same with he, she and they.',example:'He can run. They can run.'},
{type:'sort',q:'Select all sentences that are correct.',options:['He can play tennis.','They can to dance.','She can’t ski.','I can sings.'],answer:[0,2],hint:'Use the verb without TO or -S after CAN or CAN’T.',example:'I can sing. She can’t dance.'},
{type:'build',q:'Build a negative sentence.',tokens:['cannot','play','Alex','rugby.'],answer:['Alex','cannot','play','rugby.'],hint:'Subject first, then cannot, then the base verb.',example:'Mia cannot drive.'},
{type:'choice',q:'A fish can swim. What about a fish and a bicycle?',options:['A fish can ride a bicycle.','A fish can’t ride a bicycle.'],answer:1,hint:'Can a fish use bicycle pedals?',example:'A bird can fly. A fish can’t fly.'},
{type:'match',q:'Match each sentence to its meaning.',pairs:[['I can cook.','Ability'],['I can’t drive.','No ability'],['Can I come in?','Permission']],hint:'CAN can describe ability or ask for permission.',example:'Can I use your pen? → Permission.'}]},
{title:'QUESTIONS & ANSWERS',icon:'❓',desc:'Can…? Yes, I can. No, I can’t.',rules:['Can + subject + base verb?','Yes, subject + can.','No, subject + can’t.'],ex:'Can Leo swim? Yes, he can.',tasks:[
{type:'choice',q:'Choose the correct question.',options:['Can Emma sings?','Emma can sing?','Can Emma sing?'],answer:2,hint:'Begin with CAN, then the person, then the basic verb.',example:'Can Liam read Japanese?'},
{type:'build',q:'Put the question in order.',tokens:['you','Can','ride','a horse?'],answer:['Can','you','ride','a horse?'],hint:'The first word is Can.',example:'Can they play basketball?'},
{type:'choice',q:'Can Olivia drive? (No)',options:['No, she can’t.','No, Olivia doesn’t.','No, she can.'],answer:0,hint:'A negative short answer finishes with CAN’T.',example:'Can Tom ski? No, he can’t.'},
{type:'match',q:'Match the questions with short answers.',pairs:[['Can a mouse swim?','Yes, it can.'],['Can they sing?','Yes, they can.'],['Can I use this?','Yes, you can.']],hint:'Use a pronoun matching the subject.',example:'Can Sam run? → Yes, he can.'},
{type:'sort',q:'Choose all correct short answers.',options:['Yes, I can.','No, she doesn’t.','No, we can’t.','Yes, he can plays.'],answer:[0,2],hint:'In short answers, use only the pronoun + CAN/CAN’T.',example:'Can they skate? Yes, they can.'}]},
{title:'LEVELS OF ABILITY',icon:'⭐',desc:'How well can you do it?',rules:['really well ✓✓✓','well ✓✓ / quite well ✓','not very well ✗✗ / not at all ✗✗✗'],ex:'I can speak French quite well.',tasks:[
{type:'choice',q:'🏅🏅🏅 She has excellent swimming skills. Choose.',options:['She can swim really well.','She can’t swim at all.','She can swim not very well.'],answer:0,hint:'Three awards mean the highest positive ability.',example:'My brother plays the guitar excellently. He can play really well.'},
{type:'choice',q:'✗✗✗ Harry has no French skills.',options:['Harry can speak French well.','Harry can’t speak French at all.','Harry can speak French quite well.'],answer:1,hint:'Not at all means zero ability.',example:'I can’t ski at all: I have never learned.'},
{type:'sort',q:'Pick the expressions showing positive ability.',options:['really well','at all','quite well','very well'],answer:[0,2,3],hint:'The positive expressions contain WELL.',example:'I can dance well. I can’t play chess at all.'},
{type:'build',q:'Build the correct sentence.',tokens:['can','very well.','ski','We'],answer:['We','can','ski','very well.'],hint:'Place the ability expression after the verb.',example:'She can cook quite well.'},
{type:'match',q:'Match each ability level to the symbol.',pairs:[['Really well','✓ ✓ ✓'],['Quite well','✓'],['Not at all','✗ ✗ ✗']],hint:'More ticks mean stronger ability. Three crosses mean none.',example:'Well → ✓✓. Not very well → ✗✗.'}]},
{title:'ADVERB POWER',icon:'⚡',desc:'Quickly, carefully, well and more',rules:['Usually adjective + -ly','happy → happily','good → well; fast → fast'],ex:'She speaks clearly. He runs fast.',tasks:[
{type:'choice',q:'How does she walk? (slow)',options:['slowly','slowlyly','slowerly'],answer:0,hint:'For most adjectives, add -LY.',example:'quiet → quietly.'},
{type:'match',q:'Match each adjective to its adverb.',pairs:[['happy','happily'],['good','well'],['careful','carefully']],hint:'Happy changes y to i. Good is irregular.',example:'easy → easily. fast → fast.'},
{type:'sort',q:'Choose all correct adverbs.',options:['quickly','goodly','fast','beautifully'],answer:[0,2,3],hint:'GOOD becomes WELL. FAST stays FAST.',example:'He sings well, not goodly.'},
{type:'choice',q:'Choose the correct sentence.',options:['Matt well plays the guitar.','Matt plays well the guitar.','Matt plays the guitar well.'],answer:2,hint:'When there is an object, the adverb follows the object.',example:'Amy writes her homework carefully.'},
{type:'build',q:'Build the sentence.',tokens:['quietly.','Please','speak'],answer:['Please','speak','quietly.'],hint:'Put the adverb after the action.',example:'Please answer clearly.'}]},
{title:'WHAT OR WHICH?',icon:'🔍',desc:'Ask open questions and choose',rules:['WHAT = open possibilities','WHICH = limited choices','Which one: A, B or C?'],ex:'What sport do you like? Which colour: red or blue?',tasks:[
{type:'choice',q:'_____ is your favourite sport?',options:['What','Which'],answer:0,hint:'No fixed list of sports has been given.',example:'What is your favourite food?'},
{type:'choice',q:'_____ do you prefer: tennis or rugby?',options:['What','Which'],answer:1,hint:'You must choose from two named options.',example:'Which drink: water or juice?'},
{type:'sort',q:'Choose all questions that need WHICH.',options:['___ is your name?','___ shirt: green or yellow?','___ is your favourite film?','___ sport: rugby or cricket?'],answer:[1,3],hint:'Look for two clearly specified choices.',example:'Which bag, the red one or the black one?'},
{type:'build',q:'Make a question about a limited choice.',tokens:['you','Which','prefer: tea or milk?','do'],answer:['Which','do','you','prefer: tea or milk?'],hint:'Start with WHICH, then DO YOU.',example:'Which game do you prefer: chess or cards?'},
{type:'match',q:'Match each question word to the situation.',pairs:[['What','Any possible answer'],['Which','A choice from a list'],['What colour','An open colour question']],hint:'A fixed menu or named options usually need WHICH.',example:'What do you study? Which subject: maths or art?'}]},
{title:'OPINION CASTLE',icon:'💬',desc:'Ask, answer and disagree politely',rules:['Do you like…?','What do you think about…?','In my opinion… / To be honest…'],ex:'Do you like tennis? In my opinion, it’s exciting.',tasks:[
{type:'choice',q:'Choose a question asking for an opinion.',options:['Can you run?','What do you think about skiing?','Where is the ball?'],answer:1,hint:'You want to know what someone thinks, not what they can do.',example:'How do you feel about cycling?'},
{type:'match',q:'Match the opinion expressions.',pairs:[['Do you like football?','Yes, I do.'],['What do you think about tennis?','In my opinion, it’s exciting.'],['How do you feel about cricket?','To be honest, it’s boring.']],hint:'A Do you like… question often uses Yes, I do / No, I don’t.',example:'Do you like rugby? No, I don’t.'},
{type:'build',q:'Build an opinion sentence.',tokens:['opinion,','In','basketball','is exciting.','my'],answer:['In','my','opinion,','basketball','is exciting.'],hint:'Start with In my opinion, then give your idea.',example:'In my opinion, swimming is fantastic.'},
{type:'choice',q:'Someone says: “Tennis is boring.” You disagree.',options:['That isn’t true! I love tennis.','Yes, I do.', 'Can she swim?'],answer:0,hint:'Disagree with the opinion, then explain your view.',example:'That isn’t true! I think cycling is fun.'},
{type:'sort',q:'Choose all expressions for giving opinions.',options:['To be honest…','In my opinion…','Can you ski?','I think…'],answer:[0,1,3],hint:'Opinion expressions introduce what you feel or believe.',example:'I think volleyball is exciting.'}]},
{title:'FINAL STAR QUEST',icon:'🏆',desc:'Mix sports, grammar and opinions',rules:['CAN + verb','HOW? → adverb','WHAT = open / WHICH = choice','Give opinions politely'],ex:'Can you swim well? Yes, I can. I think it is exciting.',tasks:[
{type:'choice',q:'Which sentence is correct?',options:['She can plays rugby good.','She can play rugby well.','She cans play rugby well.'],answer:1,hint:'CAN + base verb; GOOD becomes WELL.',example:'He can play tennis very well.'},
{type:'match',q:'Connect the sentence with the grammar point.',pairs:[['Can you dance?','Ability question'],['She runs quickly.','Adverb of manner'],['In my opinion, it’s fun.','Giving an opinion']],hint:'Look for CAN, -LY, or an opinion phrase.',example:'Which sport? → Choice between options.'},
{type:'sort',q:'Select every correct sentence.',options:['They can go skiing.','He can’t to swim.','I play basketball well.','Which do you prefer: red or blue?'],answer:[0,2,3],hint:'After CAN’T, never use TO.',example:'We can swim. We can’t ski.'},
{type:'build',q:'Make a polite opinion question.',tokens:['think','do','What','about swimming?','you'],answer:['What','do','you','think','about swimming?'],hint:'Use What do you think about…?',example:'What do you think about gymnastics?'},
{type:'choice',q:'Complete: “Can you ride a horse?” “Yes, ____. I ride quite ____.”',options:['I can / well','I do / good','I can / good'],answer:0,hint:'Short answer with CAN; manner uses WELL.',example:'Can he sing? Yes, he can. He sings beautifully.'}]}
];
const STORE='super-sports-unit7-eli12-v1';let done=new Set(), wi=-1,si=0,selection=[],pairSelections=[],matched=[],locked=false,audioOn=true,reduce=false,timer=null;try{done=new Set(JSON.parse(localStorage.getItem(STORE)||'[]'))}catch{};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>wi+'-'+si;const task=()=>W[wi].tasks[si];
function save(){try{localStorage.setItem(STORE,JSON.stringify([...done]))}catch{}}function coinUpdate(){$('coins').textContent=done.size;$('progressText').textContent=done.size+' / '+(W.length*5)+' stars'}
let ac;function beep(kind){if(!audioOn)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();const frequencies=kind==='win'?[523,659,784,1047]:kind==='wrong'?[235,180]:kind==='coin'?[880,1175]:[440];frequencies.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.055,ac.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.1+.12);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.1);o.stop(ac.currentTime+i*.1+.13)})}catch{}}
function speak(s){if(!audioOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.replace(/[✓✗🏆⭐]/g,''));u.lang='en-GB';u.rate=.87;window.speechSynthesis.speak(u)}
function clearAdvance(){if(timer){clearTimeout(timer);timer=null}}function map(){clearAdvance();locked=false;wi=-1;$('gamePage').classList.add('hidden');$('mapPage').classList.remove('hidden');$('worldGrid').innerHTML=W.map((w,i)=>{let count=w.tasks.filter((_,j)=>done.has(i+'-'+j)).length;return `<button class="world" data-w="${i}"><strong>${w.icon} WORLD ${i+1}</strong><span class="name">${esc(w.title)}</span><span class="desc">${esc(w.desc)}</span><span class="stars" aria-label="${count} of 5 stars">${'★'.repeat(count)}${'☆'.repeat(5-count)}</span></button>`}).join('');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openWorld(+b.dataset.w,0));coinUpdate()}
function openWorld(w,s){clearAdvance();wi=w;si=s;selection=[];pairSelections=[];matched=[];locked=false;$('mapPage').classList.add('hidden');$('gamePage').classList.remove('hidden');$('levelLabel').textContent=`WORLD ${wi+1} — STAGE ${si+1}/5`;$('stepButtons').innerHTML=W[wi].tasks.map((_,j)=>`<button class="step ${j===si?'active':''} ${done.has(wi+'-'+j)?'done':''}" data-s="${j}" aria-label="Stage ${j+1}">${j+1}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openWorld(w,+b.dataset.s));$('rulesHere').textContent=W[wi].rules.join('   •   ');$('guideText').textContent=task().q;$('feedback').className='feed';$('feedback').textContent='';draw();window.scrollTo({top:0,behavior:'instant'})}
function draw(){let t=task(),a=$('activity'),h=`<h3 class="prompt">${esc(t.q)}</h3>`;if(t.type==='choice'||t.type==='sort')h+=`<div class="choices">${t.options.map((o,i)=>`<button class="tile ${selection.includes(i)?'selected':''}" data-choice="${i}" aria-pressed="${selection.includes(i)}">${esc(o)}</button>`).join('')}</div>`;if(t.type==='sort')h+='<p style="text-align:center;font-weight:600">Select every correct answer.</p>';if(t.type==='build'){h+=`<div class="answerLine">${selection.map((j,i)=>`<button class="tile selected smaller" data-remove="${i}">${esc(t.tokens[j])} ×</button>`).join('')}</div><div class="tiles">${t.tokens.map((o,i)=>selection.includes(i)?'':`<button class="tile" data-add="${i}">${esc(o)}</button>`).join('')}</div>`}if(t.type==='match'){h+='<p style="text-align:center">Tap a left tile, then its matching right tile.</p><div class="pairgrid">';let right=[...t.pairs.keys()];right=[...right.slice(1),right[0]];h+=`<div>${t.pairs.map((p,i)=>`<button class="tile ${matched.includes(i)?'pairdone':''} ${pairSelections[0]===i?'selected':''}" data-left="${i}" ${matched.includes(i)?'disabled':''}>${esc(p[0])}</button>`).join('')}</div><div>${right.map(i=>`<button class="tile pairo ${matched.includes(i)?'pairdone':''}" data-right="${i}" ${matched.includes(i)?'disabled':''}>${esc(t.pairs[i][1])}</button>`).join('')}</div></div>`;if(matched.length)h+=`<p style="text-align:center">Matched: ${matched.length} / ${t.pairs.length}</p>`}a.innerHTML=h;a.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;beep('click');let i=+b.dataset.choice;if(t.type==='choice')selection=[i];else selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];draw()});a.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(locked)return;beep('click');selection.push(+b.dataset.add);draw()});a.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(locked)return;selection.splice(+b.dataset.remove,1);draw()});a.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{if(locked)return;pairSelections=[+b.dataset.left];beep('click');draw()});a.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(locked)return;let r=+b.dataset.right;if(pairSelections.length===0){message('Select a tile in the left column first.','hint');return}if(pairSelections[0]===r){matched.push(r);beep('coin');message('Good match! Keep going.','ok')}else{beep('wrong');message('Not quite. Try a different pair.','bad')}pairSelections=[];draw()})}
function message(s,type){$('feedback').textContent=s;$('feedback').className='feed '+type}
function verify(){if(locked)return;let t=task(),correct=false;if(t.type==='choice')correct=selection.length===1&&selection[0]===t.answer;if(t.type==='sort')correct=selection.length===t.answer.length&&t.answer.every(x=>selection.includes(x));if(t.type==='build')correct=selection.length===t.answer.length&&selection.map(i=>t.tokens[i]).every((v,i)=>v===t.answer[i]);if(t.type==='match')correct=matched.length===t.pairs.length;if(!selection.length&&!matched.length){message('Choose an answer first.','hint');return}if(!correct){beep('wrong');message('Not yet. Try again or press Help me for a clue.','bad');return}locked=true;const fresh=!done.has(id());done.add(id());save();coinUpdate();beep('win');message(fresh?'Correct! ⭐ +1 coin. Great work!':'Correct! ⭐ This star is already yours.','ok');$('stepButtons').querySelectorAll('button')[si].classList.add('done');timer=setTimeout(()=>{timer=null;if(si<4)openWorld(wi,si+1);else finishWorld()},1450)}
function finishWorld(){let w=wi;const n=W[w].tasks.filter((_,j)=>done.has(w+'-'+j)).length;$('modalTitle').textContent=n===5?'WORLD COMPLETE!':'WORLD REVIEW';$('modalBody').innerHTML=`<div class="banner">🏆 ${'⭐'.repeat(n)}</div><p style="text-align:center">You earned ${n} of 5 stars in ${esc(W[w].title)}.</p><div class="exampleBoard">${n===5?'Amazing! Your next world is waiting.':'You can revisit any stage.'}</div>`;$('modalBack').classList.remove('hidden');$('closeModal').onclick=()=>{hideModal();map()}}
function example(){let t=task();$('modalTitle').textContent='💡 STEP-BY-STEP EXAMPLE';$('modalBody').innerHTML=`<p>Look at another example before answering.</p><div class="exampleBoard">${esc(t.example)}</div><p><strong>Step 1:</strong> Read the question and the important words.</p><p><strong>Step 2:</strong> Look at the blue rule strip and compare with the example.</p><p><strong>Step 3:</strong> Return to your task and choose or build your answer.</p>`;$('modalBack').classList.remove('hidden');$('closeModal').onclick=hideModal}
function hideModal(){$('modalBack').classList.add('hidden')}function retry(){clearAdvance();locked=false;selection=[];pairSelections=[];matched=[];message('Ready for another try. Your earned stars are safe.','hint');draw()}
$('verifyBtn').onclick=verify;$('retryBtn').onclick=retry;$('hintBtn').onclick=()=>{message('💡 '+task().hint,'hint');speak(task().hint)};$('exampleBtn').onclick=example;$('listenBtn').onclick=()=>speak(task().q);$('backMap').onclick=map;$('mapBtn').onclick=map;$('closeModal').onclick=hideModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))hideModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal();if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&wi>=0&&!locked&&!(!$('modalBack').classList.contains('hidden')))verify()});$('soundBtn').onclick=()=>{audioOn=!audioOn;$('soundBtn').textContent=audioOn?'🔊 Sound ON':'🔇 Sound OFF';if(!audioOn&&'speechSynthesis'in window)window.speechSynthesis.cancel()};$('motionBtn').onclick=()=>{reduce=!reduce;document.body.classList.toggle('reduced',reduce);$('motionBtn').textContent=reduce?'Motion OFF':'Motion ON'};$('resetAll').onclick=()=>{if(confirm('Reset all 40 stars and coins?')){done.clear();save();map()}};map();
</script></body></html>
